name: Release

# Se lanza al subir una etiqueta de version, por ejemplo:
#   git tag v1.0.0 && git push origin v1.0.0
# Publica una Release de GitHub con el APK firmado y el changelog desde la
# version anterior. Es el cuarto modelo de entrega del proyecto: aqui lo que
# se entrega es un instalable versionado, no un despliegue.
on:
  push:
    tags:
      - 'v*.*.*'

# Crear la Release necesita escribir en el repo. Solo este workflow lo pide.
permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # El historial completo y las etiquetas: el changelog se calcula
          # desde la etiqueta anterior.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # v1.2.3 -> VERSION_NAME=1.2.3 y VERSION_CODE=10203. Android exige que el
      # codigo crezca en cada actualizacion; con este esquema crece solo
      # mientras menor y parche no pasen de 99.
      - name: Read the version from the tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The tag '$tag' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be 99 or lower to keep VERSION_CODE growing"
            exit 1
          fi
          echo "VERSION_NAME=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      # Nada se publica si las pruebas fallan.
      - name: Test
        run: ./gradlew test

      # El keystore solo existe durante esta ejecucion, en la carpeta temporal
      # del runner, y se borra al final pase lo que pase.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Si la firma no se hubiera aplicado, Gradle dejaria un
      # app-release-unsigned.apk y esto fallaria antes de publicar nada.
      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No signed APK was produced (is the signing config applied?)"
            ls app/build/outputs/apk/release/ || true
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "financetracker-v$VERSION_NAME.apk"
          # Copia con nombre fijo: el README enlaza a releases/latest/download/financetracker.apk
          cp "$apk" financetracker.apk

      - name: Write the changelog
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## FinanceTracker Android $VERSION_NAME"
            echo
            echo "Android client of FinanceTracker, a personal finance app (income, expenses and monthly balance) backed by a .NET API on Azure."
            echo
            echo "### Install (about a minute)"
            echo
            echo "1. On an Android phone (7.0 or later), download **\`financetracker.apk\`** from *Assets* below. \`financetracker-v$VERSION_NAME.apk\` is the same file with the version in its name."
            echo "2. Open the downloaded file. The first time, Android asks you to allow your browser to *install unknown apps*: allow it and go back."
            echo "3. Tap **Install**. The app needs only internet access."
            echo
            echo "### Try it"
            echo
            echo "- On the sign-in screen, tap **Sign in with the demo account** (\`demo@financetracker.app\` / \`Demo1234!\`), or register your own account." # gitleaks:allow
            echo "- The first sign-in of the day can take a few seconds while the API wakes up."
            echo "- Language (Spanish or English) and light or dark theme can be changed inside the app."
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              range="$previous..$GITHUB_REF_NAME"
            else
              echo "### Changes"
              range="$GITHUB_REF_NAME"
            fi
            echo
            git log "$range" --no-merges --pretty='- %s'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "financetracker-v$VERSION_NAME.apk" financetracker.apk \
            --title "FinanceTracker Android $VERSION_NAME" \
            --notes-file release-notes.md

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
