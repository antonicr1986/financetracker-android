name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos minimos por defecto para el GITHUB_TOKEN: solo lectura del
# codigo. Un job que necesite mas lo declara el mismo, solo para el.
permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # El historial completo: un secreto borrado ayer sigue estando en el
          # commit que lo introdujo, y es ahi donde hay que encontrarlo.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # --retry cubre los cortes de red del runner, que son frecuentes y
          # no dicen nada sobre el codigo. Sin esto, un fallo transitorio deja
          # el pipeline en rojo y acabas ignorando los rojos.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the repository history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  # Gradle no trae un "list --vulnerable" como dotnet. En su lugar se envia a
  # GitHub el grafo completo de dependencias (tambien las transitivas, que no
  # aparecen en ningun fichero del repo), y GitHub lo cruza con su base de
  # avisos: salen como alertas de Dependabot en la pestana Security.
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # la API de envio del grafo lo exige
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Solo se envian las dependencias de la app. Las de los plugins (AGP,
      # Kotlin) se resuelven en "classpath", no van en el APK y generaban
      # alertas que Dependabot no puede corregir (dependency_not_found).
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-exclude-configurations: 'classpath'

      # En una pull request, ademas, se compara el grafo con el de main y se
      # falla si la PR introduce una dependencia con una vulnerabilidad
      # conocida de gravedad alta o critica.
      - name: Review the new dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # Cachea ~/.gradle entre ejecuciones. Sin esto cada build vuelve a
          # descargar Gradle y todas las dependencias.
          cache: gradle

      # Git en Windows no guarda el bit de ejecucion, asi que el gradlew que
      # llega al runner de Linux no es ejecutable.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test

      # Gradle dice "BUILD SUCCESSFUL" tanto si las pruebas pasan como si no se
      # llegaron a ejecutar. Esto cuenta lo que hay en los informes y lo escribe
      # en el resumen de la ejecucion, para que el numero se vea sin abrir logs.
      - name: Summarise the test results
        if: always()
        run: |
          total=0; failures=0; errors=0; skipped=0
          # Lee cada atributo por separado: Gradle los escribe en el orden
          # tests, skipped, failures, errors, y una sola expresion que
          # dependa del orden deja de coincidir y cuenta cero.
          attr() { grep -o -m1 "<testsuite [^>]*" "$2" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
          for file in $(find app/build/test-results -name 'TEST-*.xml' 2>/dev/null); do
            t=$(attr tests "$file"); f=$(attr failures "$file")
            e=$(attr errors "$file"); s=$(attr skipped "$file")
            total=$((total + ${t:-0}))
            failures=$((failures + ${f:-0}))
            errors=$((errors + ${e:-0}))
            skipped=$((skipped + ${s:-0}))
          done

          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$total run · $failures failed · $errors errored · $skipped skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$total tests run, $failures failed, $errors errored, $skipped skipped"

          # Cero pruebas es un fallo: significa que dejaron de ejecutarse y
          # nadie se entero, que es peor que verlas en rojo.
          if [ "$total" -eq 0 ]; then
            echo "::error::No unit tests were executed"
            exit 1
          fi

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Lint: Android Lint ya viene con el plugin de Android, sin dependencias
      # nuevas. Revisa Kotlin, layouts, recursos y manifiesto (traducciones que
      # faltan, APIs no disponibles en la minSdk, recursos sin usar...). Falla
      # con los problemas de gravedad "error"; los avisos quedan en el informe.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew assembleDebug

      # El APK queda descargable desde la propia ejecucion, asi que cualquiera
      # puede instalar esa version concreta sin compilar nada.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: financetracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Analisis de seguridad del APK con MobSF (Mobile Security Framework): abre
  # el APK compilado y revisa el manifiesto (componentes exportados, permisos,
  # backup, trafico sin cifrar...), el codigo descompilado, las librerias y
  # los secretos que hayan quedado dentro. Es lo equivalente a ZAP para una app
  # movil: analiza lo que se instala, no el codigo fuente.
  #  - Se analiza la build release (sin firmar: la clave solo existe en el
  #    workflow de Release), que es la que llega a los usuarios. La debug
  #    saldria con avisos propios de depuracion que no aplican.
  #  - MobSF corre en un contenedor desechable con una API key aleatoria.
  #  - Puntuacion y hallazgos en el resumen del job, e informe PDF y JSON como
  #    artefacto (mobsf-report). El job falla si aparece un hallazgo de
  #    gravedad alta que no este en .mobsf/accepted.txt (riesgos aceptados,
  #    cada uno con su motivo).
  mobsf:
    name: mobsf
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOBSF_FAIL_ON_HIGH: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Arrancar MobSF
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "MOBSF_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$key" \
            opensecurity/mobile-security-framework-mobsf:latest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the release APK (sin firmar)
        run: ./gradlew assembleRelease

      - name: Esperar a que MobSF este listo
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Mobsf-Api-Key: $MOBSF_KEY" http://localhost:8000/api/v1/scans || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::MobSF no ha arrancado"
          docker logs mobsf | tail -50
          exit 1

      - name: Analizar el APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $apk"
          hash=$(curl -sf -H "X-Mobsf-Api-Key: $MOBSF_KEY" -F "file=@$apk" http://localhost:8000/api/v1/upload | jq -r .hash)
          if [ -z "$hash" ] || [ "$hash" = "null" ]; then
            echo "::error::No se pudo subir el APK a MobSF"
            exit 1
          fi
          curl -sf -H "X-Mobsf-Api-Key: $MOBSF_KEY" -d "hash=$hash" http://localhost:8000/api/v1/scan > /dev/null
          mkdir -p mobsf-report
          curl -sf -H "X-Mobsf-Api-Key: $MOBSF_KEY" -d "hash=$hash" http://localhost:8000/api/v1/scorecard -o mobsf-report/scorecard.json
          curl -sf -H "X-Mobsf-Api-Key: $MOBSF_KEY" -d "hash=$hash" http://localhost:8000/api/v1/report_json -o mobsf-report/report.json
          curl -sf -H "X-Mobsf-Api-Key: $MOBSF_KEY" -d "hash=$hash" http://localhost:8000/api/v1/download_pdf -o mobsf-report/report.pdf || echo "::warning::No se pudo generar el PDF"

      - name: Resumen
        run: |
          card=mobsf-report/scorecard.json
          score=$(jq -r '.security_score' "$card")
          high=$(jq '.high | length' "$card")
          warning=$(jq '.warning | length' "$card")
          {
            echo "### MobSF: puntuacion de seguridad $score/100"
            echo
            echo "| Alta | Aviso | Info | Seguro |"
            echo "|---|---|---|---|"
            echo "| $high | $warning | $(jq '.info | length' "$card") | $(jq '.secure | length' "$card") |"
            echo
            if [ "$high" -gt 0 ]; then
              echo "**Hallazgos de gravedad alta:**"
              jq -r '.high[] | "- \(.title)"' "$card"
              echo
            fi
            if [ "$warning" -gt 0 ]; then
              echo "**Avisos:**"
              jq -r '.warning[] | "- \(.title)"' "$card"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "HIGH_COUNT=$high" >> "$GITHUB_ENV"

      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobsf-report
          path: mobsf-report/
          if-no-files-found: ignore

      - name: Bloquear si hay hallazgos altos nuevos
        if: env.MOBSF_FAIL_ON_HIGH == 'true'
        run: |
          grep -v '^#' .mobsf/accepted.txt | sed '/^\s*$/d' > accepted.tmp
          jq -r '.high[].title' mobsf-report/scorecard.json > high.tmp
          new=0
          while IFS= read -r title; do
            # Aceptado si el titulo contiene alguna de las lineas de la lista.
            if grep -qF -f accepted.tmp <<< "$title"; then
              echo "Aceptado: $title"
            else
              echo "::error::Hallazgo alto nuevo de MobSF: $title"
              new=$((new + 1))
            fi
          done < high.tmp
          if [ "$new" -gt 0 ]; then exit 1; fi
          echo "Sin hallazgos altos nuevos."

      - name: Apagar MobSF
        if: always()
        run: docker rm -f mobsf || true
