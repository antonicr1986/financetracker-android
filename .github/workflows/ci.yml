name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # El historial completo: un secreto borrado ayer sigue estando en el
          # commit que lo introdujo, y es ahi donde hay que encontrarlo.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # --retry cubre los cortes de red del runner, que son frecuentes y
          # no dicen nada sobre el codigo. Sin esto, un fallo transitorio deja
          # el pipeline en rojo y acabas ignorando los rojos.
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --fail \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan the repository history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          # Cachea ~/.gradle entre ejecuciones. Sin esto cada build vuelve a
          # descargar Gradle y todas las dependencias.
          cache: gradle

      # Git en Windows no guarda el bit de ejecucion, asi que el gradlew que
      # llega al runner de Linux no es ejecutable.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test

      # Gradle dice "BUILD SUCCESSFUL" tanto si las pruebas pasan como si no se
      # llegaron a ejecutar. Esto cuenta lo que hay en los informes y lo escribe
      # en el resumen de la ejecucion, para que el numero se vea sin abrir logs.
      - name: Summarise the test results
        if: always()
        run: |
          total=0; failures=0; errors=0; skipped=0
          # Lee cada atributo por separado: Gradle los escribe en el orden
          # tests, skipped, failures, errors, y una sola expresion que
          # dependa del orden deja de coincidir y cuenta cero.
          attr() { grep -o -m1 "<testsuite [^>]*" "$2" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
          for file in $(find app/build/test-results -name 'TEST-*.xml' 2>/dev/null); do
            t=$(attr tests "$file"); f=$(attr failures "$file")
            e=$(attr errors "$file"); s=$(attr skipped "$file")
            total=$((total + ${t:-0}))
            failures=$((failures + ${f:-0}))
            errors=$((errors + ${e:-0}))
            skipped=$((skipped + ${s:-0}))
          done

          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$total run · $failures failed · $errors errored · $skipped skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$total tests run, $failures failed, $errors errored, $skipped skipped"

          # Cero pruebas es un fallo: significa que dejaron de ejecutarse y
          # nadie se entero, que es peor que verlas en rojo.
          if [ "$total" -eq 0 ]; then
            echo "::error::No unit tests were executed"
            exit 1
          fi

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew assembleDebug

      # El APK queda descargable desde la propia ejecucion, asi que cualquiera
      # puede instalar esa version concreta sin compilar nada.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: financetracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
